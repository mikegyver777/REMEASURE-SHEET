<style>
/* Layout: field clipboard — sticky tool rail over a sheet of graph paper, job-specific takeoff table below */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#17212b; --muted:#5a6672; --line:#d3d9df;

  --body:"Barlow",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#12171d; --surface:#1b222a; --fg:#e7ecf1; --muted:#9aa6b2; --line:#2e3843;
  --accent:#ff6b5e; --accent-soft:#3a1f1d; --chip:#26303a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12171d; --surface:#1b222a; --fg:#e7ecf1; --muted:#9aa6b2; --line:#2e3843;
  --accent:#ff6b5e; --accent-soft:#3a1f1d; --chip:#26303a; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 40px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:980px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding-top:16px}
h1{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.04em;text-transform:uppercase;margin:0;line-height:1}
.sub{color:var(--muted);font-size:13px;margin-top:4px}
.btn{font:600 14px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:9px 12px;cursor:pointer;min-height:40px}
.btn:focus-visible,.tool:focus-visible,.chip:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--accent)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px}
.lbl{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hdr{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.hdr label{display:flex;flex-direction:column;gap:3px;min-width:0}
input,select,textarea{font:500 16px var(--body);color:var(--fg);background:transparent;border:none;border-bottom:1.5px solid var(--line);padding:6px 2px;width:100%;border-radius:0}
select{border:1.5px solid var(--line);border-radius:6px;padding:6px}
textarea{border:1.5px solid var(--line);border-radius:6px;min-height:90px;resize:vertical}
.jobs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chip{flex:0 0 auto;font:600 15px var(--display);letter-spacing:.06em;text-transform:uppercase;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.rail{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 14px rgba(20,30,40,.08)}
.tools{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.tool{flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;padding:6px 6px;border-radius:8px;border:1.5px solid transparent;background:var(--chip);color:var(--fg);cursor:pointer;font:600 12px var(--display);letter-spacing:.05em;text-transform:uppercase}
.tool svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tool[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.tool:disabled{opacity:.4}
.sep{flex:0 0 1px;background:var(--line);margin:4px 2px}
.syms{display:flex;gap:6px;overflow-x:auto;align-items:center;scrollbar-width:none}
.sym{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 10px 5px 5px;border-radius:999px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer;font:500 13px var(--body)}
.sym b{display:inline-grid;place-items:center;min-width:28px;height:28px;padding:0 5px;border-radius:14px;border:2px solid var(--ink);color:var(--ink);background:#fff;font:700 13px var(--display)}
.sym[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.opts select{width:auto;font-size:14px;padding:4px 6px}
.opts label{display:flex;gap:6px;align-items:center}
.opts input[type=checkbox]{width:18px;height:18px}
.selbar{display:flex;gap:6px;align-items:center;font-size:13px}
.sheet-wrap{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.04)}
#board{display:block;width:100%;height:auto;touch-action:none;user-select:none;-webkit-user-select:none}
#board.scroll{touch-action:pan-x pan-y pinch-zoom}
.hint{font-size:13px;color:var(--muted)}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));border-top:2px solid var(--fg);border-left:1px solid var(--line)}
.cell{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);min-width:0}
.cell .name{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.02em}
.cell .in{display:flex;align-items:center;gap:6px}
.cell .unit{font:600 13px var(--display);color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.cell.calc input{color:var(--accent);font-weight:700}
.yn{display:flex;gap:4px}
.yn button{flex:1;font:600 14px var(--display);letter-spacing:.06em;padding:7px 0;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;cursor:pointer}
.yn button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.fields-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.fields-head h2{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.05em;margin:0}
.notes-box{margin-top:12px}
/* modal */
.scrim{position:fixed;inset:0;background:rgba(10,15,20,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);color:var(--fg);width:100%;max-width:520px;border-radius:14px 14px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.05em}
.modal label{display:flex;flex-direction:column;gap:4px}
.modal .row{justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;z-index:30}
@media (max-width:720px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:440px){.hdr{grid-template-columns:1fr}.fields{grid-template-columns:1fr}h1{font-size:24px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>Remeasure Sheet</h1>

    </div>

  <section class="panel">

        <button class="btn" id="editSel" type="button">Edit</button>

      </span>
    </div>
  </div>

  <div class="sheet-wrap"><svg id="board" viewBox="0 0 1000 1200" xmlns="http://www.w3.org/2000/svg" aria-label="Drawing grid">
    <defs>
      <pattern id="minor" width="25" height="25" patternUnits="userSpaceOnUse"><path d="M25 0H0V25" fill="none" stroke="var(--grid)" stroke-width="1"/></pattern>
      <pattern id="major" width="125" height="125" patternUnits="userSpaceOnUse"><rect width="125" height="125" fill="url(#minor)"/><path d="M125 0H0V125" fill="none" stroke="var(--grid-major)" stroke-width="1.5"/></pattern>
    </defs>
    <rect width="1000" height="1200" fill="var(--paper)"/>
    <rect width="1000" height="1200" fill="url(#major)"/>
    <g id="layer"></g><g id="temp"></g>
  </svg></div>
  <div class="hint" id="hint"></div>

  <section class="panel">
    <div class="fields-head"><h2 id="fieldsTitle">Roof takeoff</h2><span class="hint">Fields change with the job type</span></div>
    <div class="fields" id="fields"></div>
    <label class="notes-box" style="display:flex;flex-direction:column;gap:4px"><span class="lbl">Job notes</span><textarea id="jobNotes" placeholder="Access, pets, gate code, special conditions…"></textarea></label>
  </section>
</div>

 roof:{label:'Roof',fields:[

  syms:[{k:'V',n:'Vent pipe'},{k:'RV',n:'Ridge vent'},{k:'SK',n:'Skylight',ask:'Size'},{k:'CH',n:'Chimney'},{k:'AC',n:'AC unit'},{k:'SAT',n:'Dish'},{k:'SP',n:'Solar'},{k:'FL',n:'Flat section'},{k:'P',n:'Pitch',ask:'Pitch (e.g. 4/12)'}]},
 pavers:{label:'Pavers',fields:[

  {id:'base',n:'Base depth',t:'num',u:'IN'},{id:'steps',n:'Steps',t:'num',u:'Qty'},
  {id:'wall',n:'Seat / retaining wall',t:'num',u:'LF'},{id:'drain',n:'Drain line',t:'num',u:'LF'},
  {id:'sealer',n:'Sealer',t:'yn'},{id:'access',n:'Equipment access',t:'text'}],
  syms:[{k:'DR',n:'Drain'},{k:'HB',n:'Hose bib'},{k:'SH',n:'Sprinkler'},{k:'TR',n:'Tree'},{k:'ST',n:'Step',ask:'Rise / width'},{k:'G',n:'Gate'},{k:'UB',n:'Utility box'}]},
 windows:{label:'Windows',fields:[
  {id:'win',n:'Window count',t:'num',u:'Qty'},{id:'doors',n:'Patio / slider doors',t:'num',u:'Qty'},
  {id:'install',n:'Install type',t:'sel',o:['','Retrofit','New construction','Block frame']},
  {id:'ext',n:'Exterior color',t:'text'},{id:'int',n:'Interior color',t:'text'},

  {id:'trim',n:'Trim / stucco repair',t:'num',u:'LF'},{id:'screens',n:'Screens',t:'yn'}],
  syms:[{k:'SL',n:'Slider',ask:'Size W x H'},{k:'SH',n:'Single hung',ask:'Size W x H'},{k:'CS',n:'Casement',ask:'Size W x H'},{k:'PW',n:'Picture',ask:'Size W x H'},{k:'SGD',n:'Slider door',ask:'Size W x H'},{k:'FD',n:'French door',ask:'Size W x H'},{k:'T',n:'Tempered'},{k:'E',n:'Egress'}]},
 coating:{label:'Coating',fields:[
  {id:'wall',n:'Wall area',t:'num',u:'SF'},{id:'eaves',n:'Eaves',t:'num',u:'LF'},
  {id:'fascia',n:'Fascia',t:'num',u:'LF'},{id:'stories',n:'Stories',t:'sel',o:['','1','2','3']},
  {id:'product',n:'Product',t:'sel',o:['','Lifetime Plus','Cool Life','Other']},{id:'color',n:'Color',t:'text'},
  {id:'stucco',n:'Stucco repair',t:'num',u:'SF'},{id:'wood',n:'Wood repair',t:'num',u:'LF'},
  {id:'primer',n:'Primer',t:'yn'}],
  syms:[{k:'GM',n:'Gas meter'},{k:'EM',n:'Electric meter'},{k:'HB',n:'Hose bib'},{k:'LT',n:'Light'},{k:'AC',n:'AC unit'},{k:'VT',n:'Vent'},{k:'CR',n:'Crack / repair',ask:'Size / note'}]},
 insulation:{label:'Insulation',fields:[
  {id:'attic',n:'Attic area',t:'num',u:'SF'},{id:'type',n:'Insulation type',t:'sel',o:['','Blown fiberglass','Blown cellulose','Batts','Spray foam']},
  {id:'exist',n:'Existing depth',t:'num',u:'IN'},{id:'rval',n:'Target R-value',t:'text'},
  {id:'remove',n:'Remove existing',t:'yn'},{id:'airseal',n:'Air sealing',t:'yn'},
  {id:'baffles',n:'Baffles',t:'num',u:'Qty'},{id:'cans',n:'Recessed lights',t:'num',u:'Qty'},
  {id:'access',n:'Attic access location',t:'text'}],
  syms:[{k:'AA',n:'Attic access'},{k:'RL',n:'Recessed light'},{k:'FN',n:'Exhaust fan'},{k:'V',n:'Vent'},{k:'D',n:'Duct'},{k:'HV',n:'HVAC unit'}]},
 gutters:{label:'Gutters',fields:[
  {id:'size',n:'Gutter size',t:'sel',o:['','5 inch','6 inch']},{id:'color',n:'Gutter color',t:'text'},
  {id:'gut',n:'Ln Ft of gutters (approx)',t:'num',u:'LF'},{id:'ds',n:'Ln Ft of downspouts (approx)',t:'num',u:'LF'},
  {id:'total',n:'Total gutters + downspouts',t:'calc',u:'LF',f:v=>(+v.gut||0)+(+v.ds||0)},
  {id:'removal',n:'Gutter removal',t:'yn'},{id:'rafter',n:'Rafter tail replacement',t:'yn'},
  {id:'cable',n:'Cable relocation',t:'yn'},{id:'filter',n:'Gutter filter',t:'yn'},
  {id:'fascia',n:'Fascia replacement',t:'num',u:'LF'}],
  syms:[{k:'DS',n:'Downspout',ask:'Length (ft)'},{k:'IC',n:'Inside corner'},{k:'OC',n:'Outside corner'},{k:'EC',n:'End cap'},{k:'SB',n:'Splash block'},{k:'UG',n:'Underground drain'}]},
 flooring:{label:'Flooring',fields:[
  {id:'sqft',n:'Total square feet',t:'num',u:'SF'},{id:'type',n:'Flooring type',t:'sel',o:['','LVP','Laminate','Tile','Hardwood','Carpet']},
  {id:'rooms',n:'Rooms',t:'num',u:'Qty'},{id:'base',n:'Baseboard',t:'num',u:'LF'},
  {id:'trans',n:'Transitions',t:'num',u:'Qty'},{id:'stairs',n:'Stair treads',t:'num',u:'Qty'},
  {id:'remove',n:'Remove existing',t:'yn'},{id:'subfloor',n:'Subfloor repair',t:'num',u:'SF'},
  {id:'under',n:'Underlayment',t:'yn'},{id:'furn',n:'Move furniture',t:'yn'}],
  syms:[{k:'TR',n:'Transition'},{k:'DR',n:'Door'},{k:'ST',n:'Stairs'},{k:'CL',n:'Closet'},{k:'RG',n:'Register'},{k:'CB',n:'Cabinet'}]}
};
const TOOLS=[
 {id:'scroll',n:'Scroll',i:'<path d="M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3"/>'},
 {id:'select',n:'Move',i:'<path d="M5 3l14 8-6 2-2 6z"/>'},
 {id:'pen',n:'Pen',i:'<path d="M4 20l4-1 11-11-3-3L5 16z"/>'},
 {id:'line',n:'Line ft',i:'<path d="M4 20L20 4"/><path d="M2 18l4 4M18 2l4 4"/>'},
 {id:'rect',n:'Box ft',i:'<rect x="4" y="6" width="16" height="12"/>'},
 {id:'note',n:'Note',i:'<path d="M5 4h14v11l-5 5H5z"/><path d="M14 20v-5h5M8 9h8M8 13h5"/>'},
 {id:'sym',n:'Symbol',i:'<circle cx="12" cy="12" r="8"/><path d="M9 12h6"/>'},
 {id:'erase',n:'Erase',i:'<path d="M16 3l5 5-11 11H5l-2-2z"/><path d="M11 8l5 5"/>'}
];
const KEY='altaRemeasure.v1';
let S={h:{},job:'roof',f:{},notes:'',items:[],scale:0,snap:true};
try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d)S=Object.assign(S,d)}catch(e){}
if(!S.h.h_date){const t=new Date();S.h.h_date=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0')}
let tool='pen',curSym=null,sel=null,undo=[],redo=[];
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const board=$('board'),layer=$('layer'),temp=$('temp');
let saveT;function save(){clearTimeout(saveT);saveT=setTimeout(()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},250)}
function snapshot(){undo.push(JSON.stringify(S.items));if(undo.length>80)undo.shift();redo=[];renderTools()}
function uid(){return Math.random().toString(36).slice(2,9)}

/* header */
['h_name','h_addr','h_phone','h_city','h_date','h_type'].forEach(id=>{const el=$(id);el.value=S.h[id]||'';el.oninput=()=>{S.h[id]=el.value;save()}});

$('scale').value=String(S.scale);$('scale').onchange=e=>{S.scale=+e.target.value;save()};
$('snap').checked=S.snap;$('snap').onchange=e=>{S.snap=e.target.checked;save()};

/* jobs */
function renderJobs(){const w=$('jobs');w.innerHTML='';Object.entries(JOBS).forEach(([k,j])=>{const b=document.createElement('button');b.type='button';b.className='chip';b.id='job_'+k;b.textContent=j.label;b.setAttribute('aria-pressed',S.job===k);b.onclick=()=>{S.job=k;curSym=null;save();renderJobs();renderSyms();renderFields()};w.appendChild(b)})}
function renderSyms(){const w=$('syms');w.innerHTML='';JOBS[S.job].syms.forEach(s=>{const b=document.createElement('button');b.type='button';b.className='sym';b.innerHTML='<b></b><span></span>';b.querySelector('b').textContent=s.k;b.querySelector('span').textContent=s.n;b.setAttribute('aria-pressed',tool==='sym'&&curSym&&curSym.k===s.k);b.onclick=()=>{curSym=s;setTool('sym')};w.appendChild(b)})}
function renderFields(){
  const j=JOBS[S.job];$('fieldsTitle').textContent=j.label+' takeoff';
  const v=S.f[S.job]||(S.f[S.job]={});const w=$('fields');w.innerHTML='';

function sketchPng(){return new Promise((res,rej)=>{const keep=sel;sel=null;draw();

  s=s.replace('<svg','<svg width="1000" height="1200"');
  const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=2000;c.height=2400;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,2000,2400);x.drawImage(img,0,0,2000,2400);res(c.toDataURL('image/jpeg',0.92))};img.onerror=rej;

    else{toast('Saving files is not available in this view')}}
  catch(e){toast('Could not build the PDF')}
  b.disabled=false;b.textContent='Save PDF to print'};
</script>
